[package]
name = "why712-core"
description = "Diagnose why an EIP-712 / EIP-2612 / Permit2 signature does not verify"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Native JSON-RPC transport. Off by default: the core must stay pure and synchronous so it
# builds for wasm32-unknown-unknown. Only the CLI turns this on; the wasm crate implements
# the same ChainClient trait over JavaScript's global fetch instead.
rpc = ["dep:alloy", "dep:tokio"]

[dependencies]
alloy-dyn-abi.workspace = true
alloy-primitives.workspace = true
alloy-sol-types.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex.workspace = true

alloy = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# Signature recovery needs no randomness, but k256 drags getrandom 0.2 in through rand_core,
# and that version hard-errors on wasm unless `js` is enabled. Declared only for wasm32 so the
# feature never reaches a native build, where it would be wrong.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["js"] }

[dev-dependencies]
insta.workspace = true
tokio.workspace = true
wiremock.workspace = true

[lints]
workspace = true
