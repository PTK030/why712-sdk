[package]
name = "why712-wasm"
description = "WebAssembly bindings for why712, the EIP-712 signature diagnostic tool"
readme = "../../README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No `rpc` feature: the native transport would drag alloy's provider stack and tokio into the
# wasm build. This crate implements the same ChainClient over window.fetch instead.
why712-core = { path = "../why712-core", version = "0.1.0" }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
serde-wasm-bindgen.workspace = true
serde.workspace = true
serde_json.workspace = true
alloy-primitives.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Request", "RequestInit", "Response", "Headers"] }
console_error_panic_hook.workspace = true

[dev-dependencies]
wasm-bindgen-test.workspace = true

[package.metadata.wasm-pack.profile.release]
# Rust 1.97 emits these standardized instructions. Binaryen requires the feature gates during
# validation even though current browsers support them.
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[lints]
workspace = true
