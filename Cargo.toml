[workspace]
resolver = "2"
members = ["crates/why712-core", "crates/why712-cli", "crates/why712-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/PTK030/why712"
homepage = "https://ptk030.github.io/why712/"
authors = ["PTK030"]
keywords = ["ethereum", "eip712", "permit", "signature", "debugging"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]

[workspace.dependencies]
why712-core = { path = "crates/why712-core", version = "0.1.0" }

# EIP-712 engine. We deliberately do not implement hashing ourselves: for a tool whose
# purpose is telling people their hashing is wrong, a bug in its own hashing is the worst
# possible failure. alloy-dyn-abi exposes every intermediate we need to report.
alloy-dyn-abi = { version = "=1.6.1", default-features = false, features = ["eip712", "std"] }
alloy-primitives = { version = "=1.6.1", default-features = false, features = ["k256", "serde", "std"] }
alloy-sol-types = { version = "=1.6.1", default-features = false, features = ["std"] }

# preserve_order: field order in `types` is semantically meaningful and must survive a
# round trip. arbitrary_precision: a uint256 passed as a JSON number must not silently
# lose precision before we ever see it.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "arbitrary_precision"] }

thiserror = "2.0.19"
hex = "0.4.3"

# Not used directly. k256 pulls getrandom 0.2 through rand_core, and that version refuses to
# compile for wasm*-unknown-unknown unless the `js` feature is on somewhere in the graph.
# Enabling a transitive feature requires naming the crate, so it is declared here and depended
# on under a wasm32 target gate. See .vault/OPEN_QUESTIONS.md Q-001.
getrandom = "0.2.17"

# Native-only, behind the `rpc` feature.
alloy = { version = "=2.2.0", default-features = false, features = [
    "provider-http",
    "reqwest-rustls-tls",
    "rpc-types",
] }
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt"] }

# CLI
clap = { version = "4.6.4", features = ["derive", "env"] }
anstream = "1.0.0"
owo-colors = "4.3.0"
anyhow = "1.0.104"

# WASM
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3.76"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3"
web-sys = "0.3"
console_error_panic_hook = "0.1.7"

# Dev
insta = "1.48.0"
assert_cmd = "2"
predicates = "3"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Confidence rules from docs/coding-standards.md, enforced by the compiler rather than by
# review. Tests opt out locally with #![allow(...)]; production code needs a justifying
# comment on every exception.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
