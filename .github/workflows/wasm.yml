name: WASM demo

on:
  push:
    branches: [main]
    paths:
      - "crates/why712-core/**"
      - "crates/why712-wasm/**"
      - "web/**"
      - "scripts/build-web.mjs"
      - "scripts/serve-web.mjs"
      - "scripts/check-web-links.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "astro.config.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/wasm.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/why712-core/**"
      - "crates/why712-wasm/**"
      - "web/**"
      - "scripts/build-web.mjs"
      - "scripts/serve-web.mjs"
      - "scripts/check-web-links.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "astro.config.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/wasm.yml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and test browser demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0
          package-manager-cache: false

      - name: Install pinned web dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          pnpm install --frozen-lockfile

      - name: Install pinned wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Test static application contracts
        run: pnpm test:web

      - name: Type-check Astro site
        run: pnpm check:web

      - name: Test WASM bindings in Chrome
        run: wasm-pack test --headless --chrome crates/why712-wasm

      - name: Build static Pages artifact
        run: node scripts/build-web.mjs

      - name: Check generated routes and links
        run: pnpm check:links

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    name: deploy GitHub Pages
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      github.event.repository.private == false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
