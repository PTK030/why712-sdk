name: why712

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    entrypoint:
      - anvil
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8545"
      - --chain-id
      - "1"
      - --fork-url
      - "${MAINNET_RPC_URL:?set MAINNET_RPC_URL to an Ethereum mainnet RPC endpoint}"
    ports:
      - "127.0.0.1:8545:8545"
    healthcheck:
      test:
        - CMD
        - cast
        - block-number
        - --rpc-url
        - http://127.0.0.1:8545
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: "no"
